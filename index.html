<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Prototipo Educativo AR</title>
    <!-- Importar A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Lógica de programación (JavaScript) -->
    <script>
      AFRAME.registerComponent('interactuar', {
        init: function () {
          // Evento: Al hacer clic o tocar el objeto, cambia de color
          this.el.addEventListener('click', () => {
            const colores = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33'];
            const colorAleatorio = colores[Math.floor(Math.random() * colores.length)];
            this.el.setAttribute('color', colorAleatorio);
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Escena AR -->
    <!-- cursor y raycaster permiten que los toques en la pantalla del móvil detecten los objetos 3D -->
    <a-scene embedded arjs cursor="rayOrigin: mouse" raycaster="objects: .interactivo">
      
      <!-- Marcador estándar 'Hiro' -->
      <a-marker preset="hiro">
        
        <!-- ELEMENTO 3D: Aquí puedes cambiar el a-box por un modelo generado por IA -->
        <!-- Ejemplo: <a-gltf-model src="tu_modelo_ia.glb" scale="0.5 0.5 0.5"></a-gltf-model> -->
        <a-box 
          class="interactivo"
          position="0 0.5 0" 
          color="#4CC3D9" 
          interactuar 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>

      </a-marker>
      
      <!-- Cámara del dispositivo -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
